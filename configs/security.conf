# Security configuration for hardened kernel builds
# Enables all security mitigations and hardening features
# May impact performance but maximizes security
# Apply with: --config-profile security

# Enable all Spectre/Meltdown mitigations
CONFIG_SPECULATION_MITIGATIONS=y
CONFIG_PAGE_TABLE_ISOLATION=y
CONFIG_RETPOLINE=y

# Kernel hardening features
CONFIG_HARDENED_USERCOPY=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y

# Stack protection
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y

# Kernel address space layout randomization
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y

# Control flow integrity (if supported)
CONFIG_CFI_CLANG=y

# Security modules
CONFIG_SECURITY=y
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_APPARMOR=y

# Audit framework
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y

# Restrict /proc and /sys access
CONFIG_PROC_KCORE=n
CONFIG_KEXEC=n
CONFIG_HIBERNATION=n

# Module signing enforcement
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_MODULE_SIG_ALL=y

# Restrict kernel pointer leaks
CONFIG_KPTR_RESTRICT=2

# Enable YAMA security module
CONFIG_SECURITY_YAMA=y

# Disable potentially dangerous features
CONFIG_DEVMEM=n
CONFIG_DEVKMEM=n
