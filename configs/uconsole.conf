# Applied on top of Raspberry Pi bcm2711_defconfig on every build.
# Add kernel options here; direct edits to the generated .config are reset.

# AXP20X Power Management IC support (required for power/battery/charging)
CONFIG_REGMAP_I2C=y

# to be able to change charging behaviour from userspace via /dev/i2c-*
CONFIG_I2C_CHARDEV=m
CONFIG_INPUT_AXP20X_PEK=y
CONFIG_CHARGER_AXP20X=m
CONFIG_BATTERY_AXP20X=m
CONFIG_AXP20X_POWER=m
CONFIG_MFD_AXP20X=y
CONFIG_MFD_AXP20X_I2C=y
CONFIG_REGULATOR_AXP20X=y

# ADC support for power monitoring
CONFIG_AXP20X_ADC=m
CONFIG_TI_ADC081C=m

# Required crypto/CRC support
CONFIG_CRYPTO_LIB_ARC4=y
CONFIG_CRC_CCITT=y

# The Makefile supplies the release suffix, including the build version.
CONFIG_LOCALVERSION=""
# CONFIG_LOCALVERSION_AUTO is not set
CONFIG_MODULES=y
