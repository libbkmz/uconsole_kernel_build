# Minimal configuration for smallest possible kernel build
# Disables non-essential features to reduce kernel size and boot time
# Apply with: --config-profile minimal

# Disable IPv6 support
CONFIG_IPV6=n

# Minimize loop block devices (0 at boot, create on demand)
CONFIG_BLK_DEV_LOOP_MIN_COUNT=0

# Disable unnecessary network protocols
CONFIG_PACKET=n
CONFIG_UNIX=y
CONFIG_INET=y
CONFIG_NETFILTER=n

# Minimal filesystem support
CONFIG_EXT2_FS=n
CONFIG_EXT3_FS=n
CONFIG_REISERFS_FS=n
CONFIG_JFS_FS=n
CONFIG_XFS_FS=n

# Disable advanced CPU features
CONFIG_CPU_FREQ=n
CONFIG_CPU_IDLE=n

# Minimal sound support
CONFIG_SND=m
CONFIG_SND_USB=n
CONFIG_SND_PCI=n

# Disable USB mass storage unless needed
# CONFIG_USB_STORAGE=n

# Minimal graphics (keep essential DRM)
CONFIG_DRM=y
CONFIG_FB=y