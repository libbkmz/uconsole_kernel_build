# Performance configuration for maximum speed
# Disables security mitigations and kernel hardening for raw performance
# WARNING: Reduces system security - use only in trusted environments
# Apply with: --config-profile performance

# Disable Spectre/Meltdown mitigations
CONFIG_SPECULATION_MITIGATIONS=n
CONFIG_PAGE_TABLE_ISOLATION=n
CONFIG_RETPOLINE=n

# Disable kernel hardening features
CONFIG_HARDENED_USERCOPY=n
CONFIG_SLAB_FREELIST_RANDOM=n
CONFIG_SLAB_FREELIST_HARDENED=n

# Disable stack protection
CONFIG_STACKPROTECTOR=n
CONFIG_STACKPROTECTOR_STRONG=n

# Disable kernel address space layout randomization
CONFIG_RANDOMIZE_BASE=n
CONFIG_RANDOMIZE_MEMORY=n

# Disable control flow integrity
CONFIG_CFI_CLANG=n

# Performance-oriented scheduler
CONFIG_PREEMPT_NONE=y
CONFIG_PREEMPT_VOLUNTARY=n
CONFIG_PREEMPT=n

# Optimize for performance over latency
CONFIG_HZ_100=y
CONFIG_HZ_250=n
CONFIG_HZ_300=n
CONFIG_HZ_1000=n
CONFIG_HZ=100

# Disable audit framework
CONFIG_AUDIT=n

# Fast memory allocation
CONFIG_SLUB=y
CONFIG_SLAB=n
