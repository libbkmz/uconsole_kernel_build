# Development configuration for kernel/driver development
# Enables helpful debugging features and relaxed security for development work
# Apply with: --config-profile development

# Enhanced debugging support
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_DWARF4=y
CONFIG_FRAME_POINTER=y
CONFIG_STACKTRACE=y

# Memory debugging
CONFIG_DEBUG_SLAB=y
CONFIG_DEBUG_KMEMLEAK=y
CONFIG_DEBUG_PAGEALLOC=y

# Lock debugging
CONFIG_DEBUG_SPINLOCK=y
CONFIG_DEBUG_MUTEXES=y
CONFIG_DEBUG_LOCK_ALLOC=y
CONFIG_PROVE_LOCKING=y

# Dynamic debugging
CONFIG_DYNAMIC_DEBUG=y

# Kernel profiling
CONFIG_PROFILING=y
CONFIG_OPROFILE=y

# Extended kernel logs
CONFIG_PRINTK_TIME=y
CONFIG_LOG_BUF_SHIFT=18

# Enable experimental features
CONFIG_EXPERIMENTAL=y

# Relaxed module loading (for unsigned modules)
CONFIG_MODULE_SIG=n
CONFIG_MODULE_SIG_FORCE=n

# Enable /proc/config.gz
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# Better crash dumps
CONFIG_KEXEC=y
CONFIG_CRASH_DUMP=y