# Base configuration for uConsole device functionality
# These options are MANDATORY for proper device boot and peripheral operation
# Applied automatically on all builds

# AXP20X Power Management IC support (required for power/battery/charging)
CONFIG_REGMAP_I2C=y

# to be able to change charging behaviour from userspace via /dev/i2c-*
CONFIG_I2C_CHARDEV=m
CONFIG_INPUT_AXP20X_PEK=y
CONFIG_CHARGER_AXP20X=m
CONFIG_BATTERY_AXP20X=m
CONFIG_AXP20X_POWER=m
CONFIG_MFD_AXP20X=y
CONFIG_MFD_AXP20X_I2C=y
CONFIG_REGULATOR_AXP20X=y

# ADC support for power monitoring
CONFIG_AXP20X_ADC=m
CONFIG_TI_ADC081C=m

# Required crypto/CRC support
CONFIG_CRYPTO_LIB_ARC4=y
CONFIG_CRC_CCITT=y

# Kernel version identification
CONFIG_LOCALVERSION_AUTO=y

# Panel and display support (commented pending external module approach)
# CONFIG_DRM_PANEL_CWD686=m
# CONFIG_DRM_PANEL_CWU50=m
# CONFIG_BACKLIGHT_OCP8178=m
