# Debug configuration for kernel troubleshooting and diagnostics
# Use when investigating kernel issues, panics, or hardware problems
# Apply with: --config-profile debug

# Magic SysRq key support for emergency debugging
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1

# DRM client logging for display issues
CONFIG_DRM_CLIENT_LOG=y

# Panic behavior - reboot after 10 seconds
CONFIG_PANIC_TIMEOUT=10

# Lockup detection system
CONFIG_LOCKUP_DETECTOR=y
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_HARDLOCKUP_DETECTOR=y
CONFIG_HARDLOCKUP_DETECTOR_BUDDY=y
CONFIG_HARDLOCKUP_DETECTOR_COUNTS_HRTIMER=y

# Workqueue watchdog for detecting stalled work items
CONFIG_WQ_WATCHDOG=y

# Additional debugging options (uncomment as needed)
# CONFIG_DEBUG_KERNEL=y
# CONFIG_DEBUG_INFO=y
# CONFIG_FRAME_POINTER=y
# CONFIG_STACKTRACE=y
